databases:
  - name: skilltrack-db
    plan: free
    databaseName: skilltrack
    user: skilltrack

services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: skilltrack-api
    runtime: python
    rootDir: skilltrack-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skilltrack-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false          # fill in after the frontend service is created
      - key: PUBLIC_BASE_URL
        sync: false          # same value as FRONTEND_URL
      - key: CORS_ORIGINS
        sync: false          # same value as FRONTEND_URL
      - key: ACCESS_TOKEN_MINUTES
        value: "480"
      - key: GEMINI_API_KEY
        sync: false          # optional — paste your key in the dashboard
      - key: GEMINI_MODEL
        value: gemini-1.5-flash

  # ── Frontend Static Site ─────────────────────────────────────────────────────
  - type: web
    name: skilltrack-frontend
    runtime: static
    rootDir: skilltrack
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false          # fill in with the backend service URL after it deploys
