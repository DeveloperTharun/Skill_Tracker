services:
  # Backend API
  - type: web
    name: skilltrack-api
    env: python
    buildCommand: "cd skilltrack-api && pip install -r requirements.txt"
    startCommand: "cd skilltrack-api && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skilltrack-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://skilltrack-frontend.onrender.com"
      - key: PUBLIC_BASE_URL
        value: "https://skilltrack-frontend.onrender.com"
      - key: FRONTEND_URL
        value: "https://skilltrack-frontend.onrender.com"

  # Frontend Static Site
  - type: web
    name: skilltrack-frontend
    env: static
    buildCommand: "cd skilltrack && npm install && npm run build"
    staticPublishPath: "./skilltrack/dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: skilltrack-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: skilltrack-db
    databaseName: skilltrack
    user: skilltrack_user
